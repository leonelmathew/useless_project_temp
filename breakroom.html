<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>☕ The Break Room | Anti-Productivity Timer</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 36px;
      max-width: 600px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 32px;
      margin: 0 0 12px 0;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.6;
    }
    .quote-box {
      background: #0f172a;
      border-left: 4px solid #38bdf8;
      padding: 16px;
      margin: 24px 0;
      border-radius: 4px;
      font-style: italic;
      color: #e2e8f0;
      font-size: 18px;
    }
    .bubble-wrap {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 24px;
    }
    .bubble {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #38bdf8;
      opacity: 0.8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }
    .bubble.popped {
      background: #334155;
      opacity: 0.3;
      cursor: default;
      transform: scale(0.85);
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 54px; margin-bottom: 12px;">🛋️</div>
    <h1>Welcome to the Break Room</h1>
    <p>Your work tab was forcibly terminated for your own well-being.<br>
    Please enjoy your mandatory <strong>20 minutes of doing absolutely nothing</strong>.</p>

    <div class="quote-box" id="quoteText">
      "Why do today what can be put off indefinitely?"
    </div>

    <h3>Infinite Bubble Wrap (Productivity Neutralizer)</h3>
    <div class="bubble-wrap" id="bubbleGrid"></div>
  </div>

  <script src="breakroom.js"></script>
</body>
</html>
